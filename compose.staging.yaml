name: fendor-staging
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: fendor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: fendor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fendor -d fendor"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  migrate:
    build: .
    env_file: .env.staging
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate", "--prefix", "apps/web"]
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    command: ["npm", "run", "worker", "--prefix", "apps/web", "--", "--loop"]

volumes:
  postgres_data:
