name: Supabase pilot encrypted backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore_only
          POSTGRES_DB: fendora_restore
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
      BACKUP_DIR: ${{ github.workspace }}/backup-output
      PGSSLROOTCERT: ${{ github.workspace }}/ops/certs/supabase-prod-ca-2021.crt
      RESTORE_DATABASE_URL: postgresql://postgres:restore_only@127.0.0.1:5432/fendora_restore
      ALLOW_DESTRUCTIVE_RESTORE_VERIFY: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          test -s "$PGSSLROOTCERT"
      - name: Create portable encrypted backup
        id: backup
        run: |
          chmod +x ops/portable-backup.sh ops/verify-portable-backup.sh
          backup="$(ops/portable-backup.sh)"
          echo "path=$backup" >> "$GITHUB_OUTPUT"
      - name: Restore and verify
        run: ops/verify-portable-backup.sh "${{ steps.backup.outputs.path }}"
      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: fendora-supabase-backup-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.path }}
            ${{ steps.backup.outputs.path }}.manifest
          retention-days: 14
          if-no-files-found: error
      - name: Open backup incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Supabase pilot backup failed"
          existing="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The scheduled encrypted backup or restore verification failed. Review workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue comment "$existing" --body "Backup verification failed again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
