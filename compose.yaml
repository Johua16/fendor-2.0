services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fendor
      POSTGRES_PASSWORD: fendor_local_only
      POSTGRES_DB: fendor
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - fendor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fendor -d fendor']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fendor_postgres:
